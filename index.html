<head>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}*{box-sizing:border-box}img{max-width:100%}[hidden]{display:none!important}</style>
<title>סתיו ועדן מתחתנים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Secular+One&display=swap">
<style>
/* Layout: one phone-sized app column, centered on wider screens, sunset gradient behind everything. Single deliberate light look. */
:root{
  --ink:#1E1B18; --ink-2:#3A3530; --muted:#6B635B;
  --ground:#FFF5EF; --sheet:#FFF5EF; --card:rgba(255,255,255,0.74); --card-solid:#FFFFFF; --line:rgba(30,27,24,0.10);
  --accent:#C2366E; --soft:#FBD6E5; --fill:#1E1B18; --hero:#C2366E; --ring:rgba(255,255,255,0.95);
  --spark:#E0569B; --disabled:#E6DED3; --error:#B42318;
  --display:'Secular One', 'Rubik', 'Arial Hebrew', Arial, sans-serif;
  --body:'Rubik', 'Arial Hebrew', Arial, system-ui, sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{
  margin:0; color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.45;
  background:var(--ground);
  -webkit-tap-highlight-color: transparent;
}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#shell{position:relative;max-width:440px;height:100%;margin:0 auto;overflow:hidden;
  background:
    radial-gradient(120% 70% at 100% 0%, #FFD6C2 0%, rgba(255,214,194,0) 60%),
    radial-gradient(90% 60% at 0% 38%, #FBCFE4 0%, rgba(251,207,228,0) 60%),
    radial-gradient(110% 60% at 50% 100%, #DCDDFF 0%, rgba(220,221,255,0) 65%),
    var(--ground)}
@media (min-width:600px) and (min-height:880px){
  body{display:flex;align-items:center;justify-content:center;background:#EFE6DF}
  #shell{width:390px;height:844px;max-width:none;margin:0;border-radius:28px;box-shadow:0 30px 80px rgba(30,27,24,.18)}
}
#app{position:absolute;inset:0}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}

/* welcome */
.welcome{padding:24px 28px 28px;gap:10px}
.welcome > :not(.orbit){position:relative;z-index:3}
.welcome .btn{margin-top:6px}
.daterow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.date{font-size:17px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.logo{display:block;width:36px;height:32px;object-fit:contain;flex-shrink:0;transform:translateY(-5px)}
.h1{margin:0;font-family:var(--display);font-weight:400;font-size:52px;line-height:1.05}
.lede{margin:0;font-size:17px;color:var(--ink-2);white-space:nowrap}
.orbit{flex:1;min-height:0;position:relative}
.stage{position:absolute;left:50%;top:50%;width:0;height:0;transform:scale(var(--k,1))}
.rings{position:absolute;left:-237px;top:-237px;width:474px;height:474px;pointer-events:none;
  -webkit-mask-image:radial-gradient(closest-side,#000 52%,transparent 100%);mask-image:radial-gradient(closest-side,#000 52%,transparent 100%)}
.rings span{position:absolute;left:50%;top:50%;border-radius:50%;border:1.5px solid var(--ring)}
.photo{position:absolute;left:-134px;top:-134px;box-sizing:border-box;z-index:2;width:268px;height:268px;max-width:none;border-radius:50%;overflow:hidden;border:6px solid var(--soft);background:#D3CEC7}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.emo{position:absolute;left:50%;top:50%;z-index:1;padding:6px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.emo span{display:block;line-height:1;opacity:.75;transition:opacity .2s,transform .2s;animation:floatY var(--dur) ease-in-out var(--delay) infinite}
.emo.dragging{cursor:grabbing}
.emo.dragging span{opacity:1;transform:scale(1.35);animation:none}
.spark{position:absolute;left:50%;top:50%;z-index:1;pointer-events:none;line-height:1;color:var(--spark)}
.spark span{display:block;animation:twinkle var(--dur) ease-in-out var(--delay) infinite}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(.96)}100%{transform:scale(1)}}
@keyframes confettiFall{0%{transform:translate3d(0,-40px,0) rotate(0);opacity:1}85%{opacity:1}100%{transform:translate3d(var(--dx),110vh,0) rotate(var(--rot));opacity:0}}
.confetti{position:absolute;top:0;display:block;box-shadow:0 0 0 .5px rgba(30,27,24,.12);animation:confettiFall var(--dur) cubic-bezier(.25,.6,.4,1) var(--delay) forwards}

/* buttons */
.btn{height:60px;border:0;border-radius:18px;background:var(--fill);color:#fff;font-size:19px;font-weight:700;width:100%}
.btn[aria-disabled="true"]{background:var(--disabled);color:var(--muted);cursor:not-allowed}
.btn.popping{animation:pop .3s ease-out}
.textbtn{height:44px;border:0;background:transparent;color:var(--ink-2);font-size:15px;font-weight:500}
.textbtn.u{text-decoration:underline}
.btn2{height:52px;border:2px solid var(--fill);border-radius:18px;background:rgba(255,255,255,.55);color:var(--ink);font-size:17px;font-weight:700;width:100%}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card-solid);display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}

/* flow */
.topbar{display:flex;align-items:center;gap:12px;padding:20px 20px 8px}
.track{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--fill);transition:width .3s}
.steplbl{font-size:14px;color:var(--muted);min-width:36px;text-align:left;font-variant-numeric:tabular-nums}
.body{flex:1;overflow-y:auto;padding:20px 24px 24px;display:flex;flex-direction:column;gap:16px}
.foot{padding:12px 24px 28px;display:flex;flex-direction:column;gap:6px}
.h2{margin:0;font-family:var(--display);font-weight:400;font-size:34px;line-height:1.15;text-wrap:balance}
.h2.nowrap{font-size:27px;white-space:nowrap;text-wrap:nowrap}
.sub{margin:0;font-size:16px;color:var(--ink-2)}
.sub.sm{font-size:15px}
.nowrap{white-space:nowrap}
.hint{font-size:13px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:8px}
.field label,.lbl{font-size:15px;font-weight:500}
.input{height:56px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:0 16px;font-size:18px;box-sizing:border-box;width:100%}
.input.err{border-color:var(--error)}
textarea.input{height:auto;padding:14px 16px;font-size:17px;resize:none}
.ltr{direction:ltr;text-align:right}
.sel-base{border:2px solid var(--line);background:var(--card);color:var(--ink)}
.sel-on{border-color:transparent;background:var(--fill);color:#fff}
.choice{text-align:right;padding:18px 20px;border-radius:18px;display:flex;flex-direction:column;gap:2px;width:100%}
.choice b{font-size:21px}
.choice small{font-size:15px;opacity:.85}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bigbtn{height:64px;border-radius:16px;font-size:18px;font-weight:700}
.stop{min-height:56px;padding:10px 16px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;font-size:17px;width:100%;text-align:right;gap:8px}
.stop small{font-size:14px;opacity:.85;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:99px;font-size:15px;font-weight:500}
.counter{display:flex;align-items:center;gap:16px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px}
.counter button{width:48px;height:48px;border-radius:12px;border:0;background:rgba(30,27,24,.06);font-size:24px}
.counter div{flex:1;text-align:center;font-size:18px;font-weight:700}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);color:var(--ink);flex-shrink:0}
.avatar.on{background:var(--soft);border:4px solid var(--accent)}
.avatar.off{background:#EDE4DA;color:var(--muted);border:4px dashed #B8AEA2}
.photostep{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:12px}
.outline{height:52px;padding:0 24px;border-radius:14px;border:2px solid var(--ink);background:var(--card-solid);font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:center}
.waze{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--card);border:2px solid var(--line);text-decoration:none;color:var(--ink)}
.waze .ic{width:48px;height:48px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.waze span{display:flex;flex-direction:column}
.alert{background:var(--card-solid);border:2px solid var(--error);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.alert b{color:var(--error)}
.okbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}

/* app */
.apphead{padding:20px 20px 10px;font-family:var(--display);font-size:26px;line-height:1.2}
.appbody{flex:1;overflow-y:auto;padding:4px 16px 110px}
.banner{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:14px}
.banner .t{flex:1;min-width:0;font-size:15px;display:flex;flex-direction:column}
.banner .t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{position:relative;margin-top:18px;background:var(--hero);color:#fff;border-radius:24px;padding:30px 20px 22px;display:flex;flex-direction:column;gap:8px}
.hero .cricket{position:absolute;left:18px;top:-16px;width:52px;height:52px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 6px 16px rgba(30,27,24,.18);animation:floatY 3.2s ease-in-out infinite}
.hero h3{margin:0;font-family:var(--display);font-weight:400;font-size:28px;line-height:1.15}
.whitebtn{margin-top:6px;height:54px;border-radius:16px;border:0;background:#fff;color:var(--ink);font-size:17px;font-weight:700}
.ghost{display:flex;flex-direction:column;gap:10px;opacity:.55}
.ghost .g{background:var(--card-solid);border-radius:20px;padding:14px 16px;border:2px dashed #CFC5B8;display:flex;flex-direction:column;gap:8px}
.ghost .who{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.ghost .dot{width:34px;height:34px;border-radius:50%}
.ph{border-radius:14px;background:#EFE7DC;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--muted);font-size:14px}
.feed{display:flex;flex-direction:column;gap:14px}
.post{background:var(--card);border-radius:20px;padding:16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.post .who{display:flex;align-items:center;gap:10px}
.post .who span{display:flex;flex-direction:column}
.post .who small{font-size:13px;color:var(--muted)}
.post p{margin:0;font-size:17px;white-space:pre-wrap}
.reacts{display:flex;gap:8px;flex-wrap:wrap}
.react{height:36px;min-width:52px;padding:0 10px;border-radius:99px;border:1.5px solid var(--line);background:var(--card-solid);font-size:15px;display:flex;align-items:center;gap:4px;justify-content:center}
.react.on{background:var(--soft);border-color:var(--accent)}
.react small{font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.spot{background:var(--hero);color:#fff;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.spot .k{font-size:14px;font-weight:700;letter-spacing:.02em}
.spot .row{display:flex;align-items:center;gap:14px}
.spot .row div:last-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.spot .name{font-size:21px;font-weight:700}
.spotbtn{height:48px;border-radius:14px;font-size:16px;font-weight:700}
.spotbtn.w{border:0;background:#fff;color:var(--ink)}
.spotbtn.o{border:2px solid #fff;background:transparent;color:#fff}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.filters .chip{flex-shrink:0;height:40px;min-height:40px}
.guest{background:var(--card);border-radius:18px;border:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);min-width:0}
.guest .nm{font-weight:700;font-size:16px}
.guest .fact{font-size:13px;color:var(--muted);width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--soft)}
.wave{position:absolute;bottom:-4px;left:-6px;font-size:22px}
.profile{background:var(--card);border-radius:24px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:10px;border:1px solid var(--line)}
.rows{margin-top:14px;background:var(--card);border-radius:20px;border:1px solid var(--line);padding:6px 18px}
.rows .r{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rows .r:last-child{border-bottom:0;padding:8px 0}
.pill{height:40px;padding:0 14px;border-radius:99px;background:var(--fill);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;text-decoration:none}
.fab{position:absolute;left:20px;bottom:calc(96px + env(safe-area-inset-bottom,0px));height:60px;padding:0 22px;border-radius:99px;border:0;background:var(--fill);color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(30,27,24,.22);z-index:5}
.tabs{position:absolute;left:0;right:0;bottom:0;height:80px;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-bottom:8px;box-sizing:border-box;z-index:6}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;color:var(--muted);font-weight:500}
.tabs button.on{color:var(--accent);font-weight:700}
.scrim{position:absolute;inset:0;background:rgba(30,27,24,.45);display:flex;flex-direction:column;justify-content:flex-end;z-index:20}
.sheet{background:var(--sheet);border-radius:26px 26px 0 0;padding:20px 20px 28px;display:flex;flex-direction:column;gap:14px}
.sheet .hd{display:flex;justify-content:space-between;align-items:center}
.sheet .hd b{font-family:var(--display);font-weight:400;font-size:24px}
.dash{height:52px;border-radius:14px;border:2px dashed #B8AEA2;background:var(--card-solid);font-size:16px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px}
.dash.on{background:var(--soft);border-color:var(--accent)}
.gsheet{align-items:center;gap:10px}
.instabtn{height:56px;border-radius:16px;background:var(--fill);color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.wavebtn{height:56px;border-radius:16px;border:2px solid var(--ink);background:var(--card-solid);font-size:16px;font-weight:700}
.wavebtn.on{background:var(--soft);border-color:var(--accent)}
.count{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.count .num{display:flex;flex-direction:column;align-items:center;min-width:76px}
.count .num b{font-family:var(--display);font-weight:400;font-size:44px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.count .num span{font-size:13px;font-weight:700}
.count .sep{width:1px;align-self:stretch;background:var(--line)}
.count .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.count .pills{display:flex;gap:6px;margin-top:4px;font-size:12px;font-weight:500;flex-wrap:wrap}
.count .pills span{background:var(--soft);border-radius:99px;padding:2px 8px;font-variant-numeric:tabular-nums}
.starters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.starters .chip{padding:0 6px;font-size:14px;white-space:nowrap}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sechead b{font-size:17px}
.lockb{margin-inline-start:auto;font-size:12px;font-weight:700;background:var(--fill);color:#fff;border-radius:99px;padding:3px 9px;white-space:nowrap}
.privbtn{height:48px;border-radius:14px;font-size:15px;font-weight:700}
.findcard{background:var(--hero);color:#fff;border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:12px;width:100%;border:0;text-align:right}
.findcard .ic{width:48px;height:48px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.findcard .go{height:40px;padding:0 14px;border-radius:12px;background:#fff;color:var(--ink);font-size:14px;font-weight:700;display:flex;align-items:center;flex-shrink:0}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.tile{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink-2);border:0;padding:0}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .lk{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--fill);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}
.tile .hearts{position:absolute;bottom:6px;left:6px;background:rgba(255,255,255,.9);border-radius:99px;padding:1px 7px;font-size:11px;font-weight:700}
.tile.out{opacity:.25}
.tile .x{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink)}
.switch{width:52px;height:32px;border-radius:99px;border:0;background:#CFC5B8;position:relative;flex-shrink:0;padding:0}
.switch::after{content:"";position:absolute;top:4px;left:24px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.switch.on{background:var(--fill)}
.switch.on::after{left:4px}
.match{position:absolute;inset:0;background:rgba(30,27,24,.5);display:flex;align-items:center;justify-content:center;padding:24px;z-index:30}
.match .box{position:relative;width:100%;background:var(--sheet);border-radius:28px;padding:32px 22px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;overflow:hidden}
.match .pair{display:flex;align-items:center}
.match .pair .avatar{width:96px;height:96px;font-size:40px;border:4px solid #fff}
.match .hand{width:44px;height:44px;border-radius:50%;background:var(--hero);display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 -14px;z-index:1;border:3px solid #fff}
.match .dot{position:absolute}
.note{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){
  .emo span,.spark span,.hero .cricket{animation:none}
  .confetti{animation-duration:.01s}
}
</style>

</head>
<body>
<div id="shell"><div id="app"></div><div id="fx" aria-hidden="true"></div></div>

function pos(r, a, off){
  const rad = a * Math.PI / 180;
  const x = Math.round(r * Math.cos(rad)) + (off ? off.x : 0), y = Math.round(r * Math.sin(rad)) + (off ? off.y : 0);

}

    '<a class="outline" style="width:100%;height:48px;text-decoration:none;color:var(--ink)" href="https://instagram.com/" target="_blank" rel="noopener">להציץ באינסטגרם קודם</a>' +
    '<div class="note">רק שניכם רואים את זה. אף דודה לא תדע.</div></div></div>';
}
function vWho(){
  const all = guestList(), others = all.filter((g) => g.id !== 'me');
  const singles = others.filter((g) => g.status === 'looking' || g.status === 'dance').length;
  const spot = others[S.spot % others.length];
  const f = FILTERS.find((x) => x.id === S.filter) || FILTERS[0];
  const shown = all.filter(f.fn);
  return '<div class="sub sm" style="margin-bottom:12px">' + others.length + ' אורחים כבר פה, ' + singles + ' מהם רווקים. סתם אומרים.</div>' +
    '<div class="spot"><div class="k">מישהו/י שכדאי להכיר הערב 💘</div><div class="row"><div class="avatar" style="width:72px;height:72px;font-size:30px;border:3px solid #fff;background:' + spot.color + '">' + spot.ini + '</div><div><div class="name">' + spot.name + '</div><div style="font-size:15px">"' + spot.fact + '"</div></div></div>' +
      '<div class="grid2" style="gap:10px"><button class="spotbtn w" data-act="openGuest" data-arg="' + spot.id + '">בוא/י נראה</button><button class="spotbtn o" data-act="shuffle">תגריל/י עוד</button></div></div>' +
    '<div class="filters">' + FILTERS.map((x) => '<button class="chip ' + sel(S.filter === x.id) + '" data-act="filter" data-arg="' + x.id + '" aria-pressed="' + (S.filter === x.id) + '">' + x.label + ' · ' + all.filter(x.fn).length + '</button>').join('') + '</div>' +
    (shown.length ? '<div class="grid2">' + shown.map((g) => '<button class="guest" data-act="openGuest" data-arg="' + g.id + '"><div style="position:relative"><div class="avatar" style="width:68px;height:68px;font-size:28px;background:' + g.color + '">' + esc(g.ini) + '</div>' + (S.waved[g.id] ? '<span class="wave" aria-hidden="true">👋</span>' : '') + '</div><span class="nm">' + esc(g.name) + '</span>' + (g.status !== 'hidden' ? '<span class="tag">' + STATUS[g.status] + '</span>' : '') + '<span class="fact">' + esc(g.fact) + '</span></button>').join('') + '</div>'
      : '<div class="sub" style="text-align:center;color:var(--muted);padding:40px 0">אין פה אף אחד בקטגוריה הזו. עדיין. תחכו לסלואו.</div>');
}
function vMe(){
  const st = STOPS.find((x) => x.id === S.stop);
  const bus = S.bus === true ? (st ? st.label + ' · ' + st.time : 'כן') : S.bus === false ? 'יש טרמפ' : 'עוד לא החלטת';
  const rs = S.rsvp ? RSVP[S.rsvp].label + (S.rsvp !== 'no' && S.count > 1 ? ' · +' + (S.count - 1) : '') : 'עוד לא ענית';
  return '<div class="profile">' + avatar(104, 44) + '<div style="font-size:24px;font-weight:700">' + esc(nm() || 'אורח/ת מסתורי/ת') + '</div>' +
      (S.status !== 'hidden' ? '<div class="tag" style="font-size:14px;padding:6px 14px;font-weight:500">' + STATUS[S.status] + '</div>' : '') +
      '<div style="text-align:center">"' + esc(S.fact.trim() || 'עוד לא סיפרת עובדה מוזרה. חבל.') + '"</div></div>' +
    '<div class="rows"><div class="r"><span>מגיע/ה?</span><b>' + rs + '</b></div><div class="r"><span>הסעה</span><b>' + bus + '</b></div>' +
      '<div class="r"><span>טלפון</span><b dir="ltr">' + esc(S.phone || 'לא צוין') + '</b></div><div class="r"><span>אינסטגרם</span><b dir="ltr">' + esc(S.insta.trim() || 'לא צוין') + '</b></div>' +
      '<div class="r"><span>מגיעים לבד?</span><a class="pill" href="' + WAZE + '" target="_blank" rel="noopener">' + ICON.nav + 'ניווט בוויז</a></div></div>' +
    '<button class="outline" style="margin-top:14px;width:100%" data-act="edit">עריכה (מותר להתחרט)</button>';
}
function vApp(){
  const titles = {wall:'הקיר של סתיו ועדן 💌', album:'האלבום של כולם 📷', who:'מי פה? 👀', me:'הפרופיל שלי ✨'};
  const inner = S.tab === 'wall' ? vWall() : S.tab === 'album' ? vAlbum() : S.tab === 'who' ? vWho() : vMe();
  let h = '<section class="screen"><h2 class="apphead" style="margin:0;font-weight:400">' + (S.tab === 'album' && S.albumView === 'find' ? 'תמצאו אותי 🔍' : titles[S.tab]) + '</h2><div class="appbody">' + inner + '</div>';
  if (S.tab === 'wall' && S.posts.length && !S.composer) h += '<button class="fab" data-act="openComposer" aria-label="העלאת ברכה או תמונה">' + ICON.plus + 'ברכה / תמונה</button>';
  h += '<nav class="tabs">' + [['wall','קיר'],['album','אלבום'],['who','מי פה?'],['me','אני']].map((t) => '<button class="' + (S.tab === t[0] ? 'on' : '') + '" data-act="tab" data-arg="' + t[0] + '" aria-current="' + (S.tab === t[0] ? 'page' : 'false') + '">' + (ICON[t[0]] || ICON.album) + '<span>' + t[1] + '</span></button>').join('') + '</nav>';
  if (S.composer) {
    const ok = S.draft.trim() || S.draftPhoto;
    h += '<div class="scrim"><div class="sheet" role="dialog" aria-label="ברכה לסתיו ועדן"><div class="hd"><b>ברכה לסתיו ועדן</b><button class="iconbtn" data-act="closeComposer" aria-label="סגירה">' + ICON.close + '</button></div>' +
      '<div class="field"><label for="cmp">מה בא לך להגיד? (בלי לחץ, כולם יקראו)</label><textarea id="cmp" class="input" rows="4" placeholder="מזל טוב! ו..." data-field="draft">' + esc(S.draft) + '</textarea></div>' +
      '<div class="grid2" style="gap:10px"><button class="dash' + (S.draftPhoto ? ' on' : '') + '" data-act="toggleDraftPhoto">' + ICON.cam + (S.draftPhoto ? 'תמונה צורפה' : 'להוסיף תמונה') + '</button>' +
      '<button class="privbtn ' + sel(S.draftPriv) + '" data-act="togglePriv" aria-pressed="' + S.draftPriv + '">🔒 רק לזוג</button></div>' +
      (S.draftPriv ? '<div class="note">רק סתיו ועדן יראו את התוכן. כולם יראו שנשלחה ברכה סודית.</div>' : '') +
      '<button class="btn" style="height:58px;font-size:18px" data-act="publish" aria-disabled="' + !ok + '">' + (S.draftPriv ? 'לשלוח רק להם' : 'לשגר לקיר') + '</button></div></div>';
  }
  const g = guestList().find((x) => x.id === S.guest);
  if (g) {
    const w = !!S.waved[g.id];
    h += '<div class="scrim"><div class="sheet gsheet" role="dialog" aria-label="' + esc(g.name) + '"><button class="iconbtn" style="align-self:flex-start" data-act="closeGuest" aria-label="סגירה">' + ICON.close + '</button>' +
      '<div class="avatar" style="width:112px;height:112px;font-size:48px;background:' + g.color + '">' + esc(g.ini) + '</div><div style="font-size:26px;font-weight:700">' + esc(g.name) + '</div>' +
      (g.status !== 'hidden' ? '<div class="tag" style="font-size:14px;padding:6px 14px;font-weight:500">' + STATUS[g.status] + '</div>' : '') +
      '<div style="text-align:center;padding:4px 12px">"' + esc(g.fact) + '"</div>' +
      '<div class="grid2" style="width:100%;gap:10px;margin-top:6px"><button class="wavebtn' + (w ? ' on' : '') + '" data-act="wave" data-arg="' + g.id + '">' + (w ? 'נופפת 👋' : 'לנופף מרחוק') + '</button><a class="instabtn" href="https://instagram.com/" target="_blank" rel="noopener">' + ICON.insta + '<span dir="ltr">' + esc(g.insta) + '</span></a></div>' +
      (w ? '<div class="sub sm" style="text-align:center">נופפת! אם גם ' + esc(g.name.split(' ')[0]) + ' ינופף/תנופף לך, תקבלו התאמה.</div>' : '') + '</div></div>';
  }
  h += vMatch();
  return h + '</section>';
}

/* ---------- render ---------- */
const app = document.getElementById('app');
function render(){
  const a = document.activeElement, fid = a && a.id && app.contains(a) ? a.id : null;
  let ss = null, se = null; try { if (fid) { ss = a.selectionStart; se = a.selectionEnd; } } catch (e) {}
  let html;
  if (S.screen === 'welcome') html = vWelcome();
  else if (S.screen === 'login') html = vLogin();
  else if (S.screen === 'app') html = vApp();
  else html = vFlow();
  app.innerHTML = html;
  fitOrbit();
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus({preventScroll:true}); try { if (ss != null) el.setSelectionRange(ss, se); } catch (e) {} } }
}
let K = 1;
function fitOrbit(){
  const o = app.querySelector('.orbit'); if (!o) return;
  K = 1;
  o.style.setProperty('--k', '1');
}
window.addEventListener('resize', fitOrbit);
function set(o){ Object.assign(S, o); render(); }
function enterApp(){ set({screen:'app', tab:'wall', joined:!!nm()}); }

function confetti(){
  const fx = document.getElementById('fx');
  const colors = ['#E0569B','#1E1B18','#F5C928','#7CCFEF'];
  let out = '';
  for (let i = 0; i < 56; i++) {
    const w = 6 + (i * 7) % 7, hh = i % 3 === 0 ? w : w * 1.8;
    out += '<span class="confetti" style="left:' + ((i * 37 + 11) % 100) + '%;width:' + w + 'px;height:' + hh + 'px;background:' + colors[i % 4] + ';border-radius:' + (i % 4 === 0 ? '50%' : '2px') + ';--dx:' + (((i * 29) % 120) - 60) + 'px;--rot:' + (360 + (i * 47) % 540) + 'deg;--dur:' + (1.6 + ((i * 13) % 10) / 10) + 's;--delay:' + ((i * 17) % 40) / 100 + 's"></span>';
  }
  fx.innerHTML = out;
  setTimeout(() => { fx.innerHTML = ''; }, 3200);
}

const ACT = {
  start(el){ if (S.busy) return; S.busy = true; el.classList.add('popping'); confetti(); setTimeout(() => { S.busy = false; set({screen:'rsvp'}); }, 1300); },
  toLogin(){ set({screen:'login', loginErr:false}); },
  go(_, arg){ set({screen:arg, loginErr:false}); },
  login(){
    const d = digits(S.loginPhone); if (d.length < 9) return;
    if (phoneOk() && d === digits(S.phone)) set({screen:'app', tab:'wall', joined:true, loginErr:false}); else set({loginErr:true});
  },
  registerFromLogin(){ set({screen:'rsvp', phone:S.loginPhone || S.phone, loginErr:false}); },
  back(){ const f = flow(), i = f.indexOf(S.screen); set({screen: i <= 0 ? 'welcome' : f[i - 1]}); },
  next(){
    if (!canNext()) return;
    const f = flow(), i = f.indexOf(S.screen);
    if (S.screen === 'photo') return enterApp();
    if (S.screen === 'bye') {
      if (!S.byeSent) { if (S.draft.trim()) addPost(S.draft.trim(), false); return set({byeSent:true, draft:''}); }
      return set({screen:'app', tab:'wall'});
    }
    set({screen:f[i + 1]});
  },
  skip(){ const f = flow(), i = f.indexOf(S.screen); if (S.screen === 'photo') return enterApp(); set({screen:f[i + 1]}); },
  rsvp(_, a){ set({rsvp:a}); },
  inc(){ set({count:Math.min(S.count + 1, 6)}); },
  dec(){ set({count:Math.max(S.count - 1, 1)}); },
  bus(_, a){ a === 'yes' ? set({bus:true}) : set({bus:false, stop:null}); },
  stop(_, a){ set({stop:a}); },
  status(_, a){ set({status:a}); },
  togglePhoto(){ set({photo:!S.photo}); },
  dismissJoined(){ set({joined:false}); },
  openComposer(){ set({composer:true}); },
  closeComposer(){ set({composer:false, draft:'', draftPhoto:false, draftPriv:false}); },
  toggleDraftPhoto(){ set({draftPhoto:!S.draftPhoto}); },
  starter(_, a){ const st = STARTERS[+a]; set({composer:true, draft:st.text, draftPhoto:st.photo}); },
  publish(){ if (!(S.draft.trim() || S.draftPhoto)) return; addPost(S.draft.trim() || 'תמונה בלי מילים. היא מדברת בעד עצמה.', S.draftPhoto, S.draftPriv); set({composer:false, draft:'', draftPhoto:false, draftPriv:false, joined:false}); },
  togglePriv(){ set({draftPriv:!S.draftPriv}); },
  openFind(){ set({albumView:'find'}); },
  closeFind(){ set({albumView:'grid'}); },
  albumFilter(_, a){ set({albumFilter:a}); },
  toggleFace(){ set({faceOn:!S.faceOn}); },
  notMe(_, a){ const n = Object.assign({}, S.notMe); if (n[a]) delete n[a]; else n[a] = true; set({notMe:n}); },
  closeMatch(){ set({matchWith:null, guest:null}); },
  react(_, a){
    const [id, k] = a.split(':');
    S.posts = S.posts.map((p) => { if (String(p.id) !== id) return p; const mine = Object.assign({}, p.mine), r = Object.assign({}, p.r); if (mine[k]) { delete mine[k]; r[k]--; } else { mine[k] = true; r[k]++; } return Object.assign({}, p, {mine, r}); });
    render();
  },
  tab(_, a){ set({tab:a, albumView:'grid'}); },
  filter(_, a){ set({filter:a}); },
  shuffle(){ set({spot:S.spot + 1}); },
  openGuest(_, a){ set({guest:a}); },
  closeGuest(){ set({guest:null}); },
  wave(_, a){ const w = Object.assign({}, S.waved); const on = !w[a]; if (on) w[a] = true; else delete w[a]; const mutual = on && (a === 'g1' || a === 'g4'); if (mutual) { set({waved:w}); setTimeout(() => set({matchWith:a}), 600); } else set({waved:w}); },
  edit(){ set({screen:'rsvp'}); }
};

app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || !app.contains(el)) return;
  if (el.getAttribute('aria-disabled') === 'true') return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el, el.dataset.arg);
});
app.addEventListener('input', (e) => {
  const k = e.target.dataset && e.target.dataset.field; if (!k) return;
  S[k] = e.target.value;
  if (k === 'loginPhone') S.loginErr = false;
  render();
});
app.addEventListener('click', (e) => { if (e.target.classList && e.target.classList.contains('scrim')) { if (S.composer) ACT.closeComposer(); else if (S.guest) ACT.closeGuest(); } });

/* drag the floating emojis */
let drag = null;
app.addEventListener('pointerdown', (e) => {
  const el = e.target.closest('[data-drag]'); if (!el) return;
  e.preventDefault();
  const i = +el.dataset.drag, cur = S.offsets[i] || {x:0, y:0};
  drag = {el, i, sx:e.clientX, sy:e.clientY, ox:cur.x, oy:cur.y};
  try { el.setPointerCapture(e.pointerId); } catch (err) {}
  el.classList.add('dragging');
});
app.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const o = ORBIT[drag.i], off = {x:drag.ox + (e.clientX - drag.sx) / K, y:drag.oy + (e.clientY - drag.sy) / K};
  S.offsets[drag.i] = off;
  drag.el.style.transform = pos(o.r, o.a, off).replace('transform:', '');
});
const endDrag = () => { if (drag) { drag.el.classList.remove('dragging'); drag = null; } };
app.addEventListener('pointerup', endDrag);
app.addEventListener('pointercancel', endDrag);

render();
})();
</script>

</body>
</html>
